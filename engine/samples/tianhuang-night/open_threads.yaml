- id: thread_jade_slip
  title: 袖中传讯玉简
  description: 林凡持有一枚未使用的传讯玉简，可单向传音给林晚舟，但使用后即碎，且可能暴露自己偷听之事
  status: open
- id: thread_soul_bell
  title: 退魂铃
  description: 林晚舟脖间退魂铃是压制旧伤的器物，离身过久将神魂涣散；墨青烟的目标可能与此有关
  status: open
- id: thread_seclusion_order
  title: 玄机道人禁足令
  description: 林凡仍受禁足令约束，擅离将被执法堂拿下，但若不动则师姐或将赴死局
  status: open
- id: thread_wake_powder
  title: 楚明的醒神散
  description: 药庐中有半成品醒神散，可短暂提升感知，或用于识破幻阵
  status: open
- id: thread_bamboo_array
  title: 竹林阵纹
  description: 墨青烟在竹林布下困阵，针对神魂与铃音共振
  status: open
